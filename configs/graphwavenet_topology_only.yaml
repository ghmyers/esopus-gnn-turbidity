# =============================================================================
# Topology-only ablation (Section "Ablation" of the manuscript)
# Identical to graphwavenet_full.yaml except adjacency_mode: fixed
# =============================================================================
#   python scripts/10_train.py    --config configs/graphwavenet_topology_only.yaml
#   python scripts/11_evaluate.py --config configs/graphwavenet_topology_only.yaml
#
# These hyper-parameters reproduce the published checkpoint
# (archived as outputs/models/gwn_topology_only.pt).

experiment:
  run_name: gwn_topology_only                # prefix for every artefact this run writes
  mlflow_experiment: esopus_turbidity
  notes: "Ablation: fixed NHD topology only (no learned adjacency)"

data:
  graph_pkl: data/processed/esopus_graph_features.pkl   # output of scripts/06
  test_split_date: "2023-09-19"      # train < split date <= test
  num_timesteps_in: 17               # 17-h input window (the dilated convolutions use only the last 7 h; docs/KNOWN_ISSUES.md)
  num_timesteps_out: 1               # one-step-ahead (1 h) prediction
  eps: 0.00001                       # separates observed zeros from the 0.0 missing-value sentinel

loader:
  batch_size: 32
  drop_last_train: true              # avoids a tiny final batch skewing batch-norm statistics
  num_workers: 0

model:
  hidden_channels: 16                # WaveNet residual channels
  ff_channels: 32                    # feed-forward (skip/readout) channels
  n_layers: 4                        # dilated temporal conv + graph conv blocks
  adjacency_mode: fixed              # ABLATION: NHD adjacency only, no E1/E2 embeddings
  embedding_dim: 10                  # node-embedding size for the learned adjacency

training:
  num_epochs: 75
  learning_rate: 0.0003              # Adam, cosine-annealed to 1% of this value
  optimizer: adam
  weight_decay: 0.0
  patience: 15                       # early-stopping patience (epochs)
  min_delta: 0.0
  grad_clip_norm: 1.0
  mask_val: 0.0                      # scaled value marking missing targets
  seed: 0
  eval_interval: 5                   # epochs between full per-node metric evaluations
